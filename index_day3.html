<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Aplikasi Catatan Tugas</h1>
            <p1 class="subtitle">Contoh Java Script</p1>
        </header>

        <form id="todo-form">
            <input
            type="text"
            id="todo-input"
            placeholder="Tulis Kegiatan Baru Disini"
            autocomplete="off"
            >

            <button
            type="submit"
            id="add-btn"
            >Tambah</button>
        </form>

        <div class="status-bar">
            <span>Total : <strong id="total-count">0</strong></span>
            <span>Selesai : <strong id="completed-count">0</strong></span>
        </div>

        <ul id="todo-list"></ul>
        <p id="empty-message" class="empty-message">Belum ada tugas, tambahkan tugas!</p>
    </div>

    <script src="index.js">

    </script>
</body>
</html>
